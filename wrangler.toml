name = "waluga-park-lot-9"
main = "src/worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "4992parkbluff.com", custom_domain = true },
  { pattern = "www.4992parkbluff.com", custom_domain = true }
]

# Static site in ./public. The Worker runs first to redirect www and handle /api/inquire.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Cloudflare Email Service. The domain is onboarded for sending (SPF/DKIM/DMARC in DNS).
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["inquiries@4992parkbluff.com"]

[vars]
INQUIRY_FROM = "inquiries@4992parkbluff.com"
INQUIRY_FROM_NAME = "4992 Park Bluff Pl"
# Inquiry recipient (listing agent). Comma-separate to add more.
INQUIRY_TO = "abby.m.realtor@gmail.com"

# Optional secrets: TURNSTILE_SECRET (spam check). EMAIL_PROVIDER=binding|cloudflare|resend overrides.
